apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seneschal
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./platform/apps/seneschal/overlays/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: networking
  wait: true
  timeout: 5m
