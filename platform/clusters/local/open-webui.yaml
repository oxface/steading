apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./platform/apps/open-webui/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: networking
  wait: true
  timeout: 15m
