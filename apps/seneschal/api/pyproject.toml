[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I import sorting (isort) · UP modernize syntax (pairs with the
# typing deep-dive) · B bugbear pitfalls · SIM simplifications · ASYNC blocking-in-async traps · RUF ruff's own
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
